[project]
name = "technician-assistant"
version = "0.1.0"
description = "Windows technician voice assistant powered by Guava AI"
requires-python = ">=3.11"
dependencies = [
    "guava-sdk>=0.47",
    "keyring>=25.6",
    "platformdirs>=4.4",
    "pypdf>=6.1",
    "PySide6-Essentials>=6.9",
]

[project.optional-dependencies]
webrtc = ["PySide6-WebEngine>=6.9"]
dev = [
    "mypy>=1.18",
    "pyinstaller>=6.16",
    "pytest>=8.4",
    "pytest-qt>=4.5",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technician_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["technician_assistant"]
exclude = "src/technician_assistant/ui/webrtc_view.py"
disable_error_code = ["untyped-decorator"]
